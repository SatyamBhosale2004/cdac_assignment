<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satyam Bhosale Portfolio</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&family=Irish+Grover&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Shadows+Into+Light&family=Volkhov:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body id="home">
    <!-- </main> -->
    <main id="train">
      <div id="train-scene"></div>
      <div id="navbar"></div>

      <section class="content">
        <h1 class="home">Hey, I'm Satyam Bhosale</h1>
        <p>Aspiring SDE, Building things & exploring ideas</p>
        <div id="cta-btns">
          <button id="cta-home-get-to-know-me">Get to know me</button>
          <button id="cta-home-say-hello">Say Hello</button>
        </div>
        <div id="say-hello">
          <label class="say-hello-label" for="say-hello-input"
            >Enter your name</label
          >
          <input
            id="say-hello-input"
            name="say-hello-input"
            type="text"
            minlength="2"
            placeholder="Your Name"
          />
          <button id="welcome-btn" type="button">Welcome Me</button>
        </div>
      </section>
    </main>
    <script src="js/script.js"></script>
    <script src="js/common.js"></script>
  </body>
</html>
